# Render Free sleeps after ~15 minutes idle. Ping /health so the dyno stays warm.
# GitHub only runs schedule on the repo DEFAULT branch (usually main).
name: Keep Render awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: GET /health
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 45 \ 
          "https://api.bkti.id.vn/health"
